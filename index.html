<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Botiga Lumesis</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf6f0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-family: Georgia, serif;
            color: #b88b62;
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }
        .productes {
            padding: 50px 30px 80px;
        }

        .productes h2 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: normal;
            color: #b88b62;
            margin-bottom: 40px;
        }

        .botiga {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .producte {
            background: white;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
        }

        .foto {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f3ece4;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .producte h3 {
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: normal;
            color: #6d5a4d;
            margin: 5px 0 10px;
        }

        .producte p {
            font-size: 14px;
            line-height: 1.5;
            color: #85766c;
            margin: 0 10px 15px;
        }

        .preu {
            color: #b88b62;
            font-size: 17px;
            margin-bottom: 18px;
        }

        .producte button {
            border: none;
            background: #b88b62;
            color: white;
            padding: 11px 24px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .productes {
                padding: 40px 20px 70px;
            }

            .productes h2 {
                font-size: 28px;
            }

            .botiga {
                grid-template-columns: 1fr;
                gap: 25px;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>LUMESIS</h1>
    </header>
    <section class="productes">


        <div class="botiga">

            <div class="producte">

                <div class="foto"></div>

                <h3>Entre blaus i llum</h3>

                <p>
                    Una aquarel·la pintada a mà que captura un instant de calma entre el blau del mar i la llum del cel.
                </p>

                <div class="preu">5 €</div>

                <button>COMPRAR</button>

            </div>
        </div>

    </section>
</body>

</html>
