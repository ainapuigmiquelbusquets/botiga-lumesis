<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Botiga Lumesis</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf6f0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-family: Georgia, serif;
            color: #b88b62;
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }
        .productes {
            padding: 50px 30px 80px;
        }

        .productes h2 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: normal;
            color: #b88b62;
            margin-bottom: 40px;
        }
.botiga {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
}
        .producte {
            background: white;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
        }
.foto {
    width: 100%;
    background: #f3ece4;
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
}

.foto img {
    width: 100%;
    height: auto;
    display: block;
}
.foto img {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    display: block;
}
        .producte h3 {
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: normal;
            color: #6d5a4d;
            margin: 5px 0 10px;
        }

        .producte p {
            font-size: 14px;
            line-height: 1.5;
            color: #85766c;
            margin: 0 10px 15px;
        }

        .preu {
            color: #b88b62;
            font-size: 17px;
            margin-bottom: 18px;
        }

        .producte button {
            border: none;
            background: #b88b62;
            color: white;
            padding: 11px 24px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
        }

        @media (max-width: 768px) {

            .productes {
                padding: 40px 20px 70px;
            }

            .productes h2 {
                font-size: 28px;
            }
.botiga {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
        }
                .idiomes {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .idiomes button {
            background: none;
            border: none;
            color: #8a7769;
            font-size: 12px;
            cursor: pointer;
            padding: 5px;
        }

        .idiomes button:hover {
            color: #b88b62;
        }
    </style>
</head>

<body>
<header>

    <h1>LUMESIS</h1>

    <div class="idiomes">
        <button onclick="canviarIdioma('ca')">CAT</button>
        <button onclick="canviarIdioma('es')">ESP</button>
        <button onclick="canviarIdioma('fr')">FR</button>
        <button onclick="canviarIdioma('en')">EN</button>
    </div>

</header>
    <section class="productes">


        <div class="botiga">

            <div class="producte">
<div class="foto">
    <img src="projecte3.1" alt="Entre blaus i llum">
</div>

                <h3>Entre blaus i llum</h3>

                <p>
                    Una aquarel·la pintada a mà que captura un instant de calma entre el blau del mar i la llum del cel.
                </p>

                <div class="preu">5 €</div>

                <button>COMPRAR</button>

            </div>
        </div>

    </section>
</body>

</html>
